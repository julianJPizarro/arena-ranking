services:
  postgres:
    image: postgres:18-alpine
    container_name: arena-ranking-db
    environment:
      POSTGRES_DB: arena_ranking
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
    ports:
      - "5432:5432"
    volumes:
      - arena_ranking_data:/var/lib/postgresql/data

volumes:
  arena_ranking_data:
