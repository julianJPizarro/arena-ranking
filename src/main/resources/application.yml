spring:
  application:
    name: arena-ranking

  datasource:
    url: jdbc:postgresql://localhost:5433/arena_ranking
    username: arena
    password: arena

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
